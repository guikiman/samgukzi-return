name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ip-gate:
    # 파생작 자산이 리모트에 올라가면 되돌릴 수 없다(공개 저장소).
    # pre-push 훅은 clone 마다 설치해야 하지만 이 잡은 항상 돈다.
    # 전체 히스토리를 스캔하므로 과거에 실렸던 경우에도 걸린다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 전체 히스토리 스캔이 필요하다 — 얕은 clone 이면 최근 커밋만 보인다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Block derived-work assets
        run: node scripts/check_ip_assets.mjs --all

      - name: Verify every shipped asset has recorded provenance
        # 대장(allowlist) 검사 — 출처가 없거나 미확인인 자산은 배포를 막는다.
        # --all 은 과거 커밋에 실렸던 자산을 잡고, 이건 앞으로 추가되는 것을 막는다.
        run: node scripts/check_ip_assets.mjs --provenance

  test:
    # 저작권 게이트에 걸리면 테스트는 돌릴 필요가 없다 — 배포 전에 막는 게 목적이다.
    needs: ip-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 — vitest 4 forks pool이 요구하는 undici(webidl.util.markAsUncloneable) 호환
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit & integration tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Browser E2E smoke
        run: node tests/e2e/browser_smoke.mjs

      - name: Service worker offline
        # npm run test:e2e 와 같은 구성. 브라우저 스모크만 돌리면 PWA 오프라인
        # 파손이 CI 로 올라오지 않아서, 여기서도 반드시 돌린다.
        run: node tests/e2e/sw_offline.mjs

  deploy:
    # 테스트 통과 시 기본 브랜치에 한해 GitHub Pages 배포
    # [결함 수정] 예전에는 test 만 기다렸다. ip-gate 가 실패해도 deploy 가 돌아가서
    # 저작권 위반 자산이 그대로 공개 배포될 수 있었다. 게이트는 배포를 반드시 막아야 한다.
    needs: [ip-gate, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 — vitest 4 forks pool이 요구하는 undici(webidl.util.markAsUncloneable) 호환
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 게임은 루트의 index.html + dist/src/* + style.css 구조로 서빙됨 —
      # node_modules 제외를 위해 필요한 산출물만 pages/ 로 모은다
      - name: Assemble pages directory
        run: |
          mkdir -p pages
          cp index.html style.css pages/
          cp -r dist pages/dist
          # [E43] PWA 오프라인 캐싱 — SW + 프리캐시 매니페스트 포함
          cp sw.js sw-precache.json pages/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
