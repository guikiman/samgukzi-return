name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 이전 태그 대비 로그 생성을 위해 전체 히스토리+태그 fetch
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust tooling
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm install

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          # 이전 태그 → 현재 태그 사이의 커밋 로그로 릴리즈 노트 자동 생성
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '2p')
          CUR_TAG=${GITHUB_REF_NAME}
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$CUR_TAG" ]; then
            LOG=$(git log --oneline --no-decorate "$PREV_TAG..$CUR_TAG" | sed 's/^/  - /')
          else
            LOG='  - 최초 정식 릴리즈'
          fi
          {
            echo '### 변경사항'
            echo "$LOG"
            echo
            echo '### 웹 버전'
            echo 'https://guikiman.github.io/samgukzi-return/ — PWA 오프라인 플레이 지원'
          } > release_notes.md

          # 멀티라인 output 처리 — EOF 구분자 사용
          {
            echo 'body<<EOF_NOTES'
            cat release_notes.md
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"
          cat release_notes.md

      - name: Build and Publish with Tauri Action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: samgukzi-return-desktop-v__VERSION__
          releaseName: '삼국지리턴 Desktop v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
